name: MVP checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/make_demo.py --out data-demo
      - run: python run.py --data data-demo --out results
      - run: python scripts/check_submission.py --data data-demo --out results --expected-nodes 0
      - uses: actions/upload-artifact@v4
        with:
          name: fictional-demo-${{ matrix.os }}
          path: results/
